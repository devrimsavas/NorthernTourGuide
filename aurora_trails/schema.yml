openapi: 3.0.3
info:
  title: Aurora Trails API
  version: 1.0.0
  description: Booking platform for Arctic adventure tours in Northern Norway.
paths:
  /api/activity-types/:
    get:
      operationId: activity_types_list
      tags:
      - activity-types
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityType'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/bookings/:
    post:
      operationId: bookings_create
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreate'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreate'
          description: ''
  /api/bookings/{reference}/cancel/:
    post:
      operationId: bookings_cancel_create
      parameters:
      - in: path
        name: reference
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
          description: ''
  /api/bookings/{reference}/review/:
    post:
      operationId: bookings_review_create
      parameters:
      - in: path
        name: reference
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCreate'
          description: ''
  /api/bookings/me/:
    get:
      operationId: bookings_me_list
      tags:
      - bookings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingList'
          description: ''
  /api/guide/bookings/:
    get:
      operationId: guide_bookings_list
      parameters:
      - in: query
        name: slot
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - confirmed
          - pending
        description: |-
          * `pending` - Pending
          * `confirmed` - Confirmed
          * `cancelled` - Cancelled
      tags:
      - guide
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuideBooking'
          description: ''
  /api/guide/tours/:
    get:
      operationId: guide_tours_list
      tags:
      - guide
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuideTour'
          description: ''
    post:
      operationId: guide_tours_create
      tags:
      - guide
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuideTour'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GuideTour'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GuideTour'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuideTour'
          description: ''
  /api/guide/tours/{id}/:
    get:
      operationId: guide_tours_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - guide
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuideTour'
          description: ''
    put:
      operationId: guide_tours_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - guide
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuideTour'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GuideTour'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GuideTour'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuideTour'
          description: ''
    patch:
      operationId: guide_tours_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - guide
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGuideTour'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGuideTour'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGuideTour'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuideTour'
          description: ''
  /api/guide/tours/{id}/slots/:
    get:
      operationId: guide_tours_slots_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - guide
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuideTourSlot'
          description: ''
    post:
      operationId: guide_tours_slots_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - guide
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuideTourSlot'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GuideTourSlot'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GuideTourSlot'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuideTourSlot'
          description: ''
  /api/guides/:
    get:
      operationId: guides_list
      tags:
      - guides
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Guide'
          description: ''
  /api/guides/{id}/:
    get:
      operationId: guides_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - guides
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guide'
          description: ''
  /api/locations/:
    get:
      operationId: locations_list
      tags:
      - locations
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
          description: ''
  /api/tours/:
    get:
      operationId: tours_list
      parameters:
      - in: query
        name: activity_type
        schema:
          type: integer
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: difficulty
        schema:
          type: string
          enum:
          - challenging
          - easy
          - moderate
        description: |-
          * `easy` - Easy
          * `moderate` - Moderate
          * `challenging` - Challenging
      - in: query
        name: location
        schema:
          type: integer
      - in: query
        name: max_price
        schema:
          type: number
      tags:
      - tours
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tour'
          description: ''
  /api/tours/{id}/:
    get:
      operationId: tours_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - tours
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourDetail'
          description: ''
  /api/tours/{id}/forecast/:
    get:
      operationId: tours_forecast_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - tours
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourForecast'
          description: ''
        '503':
          description: Weather forecast is temporarily unavailable.
  /api/tours/{id}/reviews/:
    get:
      operationId: tours_reviews_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - tours
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
          description: ''
components:
  schemas:
    ActivityType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
      required:
      - id
      - name
    AuroraForecast:
      type: object
      properties:
        kp:
          type: number
          format: double
        chance:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ChanceEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - chance
      - kp
    BookingCreate:
      type: object
      properties:
        reference:
          type: string
          format: uuid
          readOnly: true
        slot:
          type: integer
        participants:
          type: integer
          maximum: 2147483647
          minimum: 1
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - participants
      - reference
      - slot
      - status
      - total_price
    BookingList:
      type: object
      properties:
        reference:
          type: string
          format: uuid
          readOnly: true
        tour:
          type: string
          readOnly: true
        start_time:
          type: string
          format: date-time
          readOnly: true
        participants:
          type: integer
          maximum: 2147483647
          minimum: 0
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        has_review:
          type: boolean
          readOnly: true
        can_review:
          type: boolean
          readOnly: true
        can_cancel:
          type: boolean
          readOnly: true
      required:
      - can_cancel
      - can_review
      - created_at
      - has_review
      - participants
      - reference
      - start_time
      - total_price
      - tour
    ChanceEnum:
      enum:
      - low
      - medium
      - high
      type: string
      description: |-
        * `low` - low
        * `medium` - medium
        * `high` - high
    DifficultyEnum:
      enum:
      - easy
      - moderate
      - challenging
      type: string
      description: |-
        * `easy` - Easy
        * `moderate` - Moderate
        * `challenging` - Challenging
    Guide:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        bio:
          type: string
          readOnly: true
        languages:
          type: string
          readOnly: true
        years_of_experience:
          type: integer
          readOnly: true
        base_location:
          type: string
          readOnly: true
        photo:
          type: string
          format: uri
          nullable: true
          readOnly: true
      required:
      - base_location
      - bio
      - id
      - languages
      - photo
      - years_of_experience
    GuideBooking:
      type: object
      properties:
        reference:
          type: string
          format: uuid
          readOnly: true
        tour:
          type: string
          readOnly: true
        slot:
          type: integer
        start_time:
          type: string
          format: date-time
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        customer_email:
          type: string
          format: email
          readOnly: true
        participants:
          type: integer
          maximum: 2147483647
          minimum: 0
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer_email
      - customer_name
      - participants
      - reference
      - slot
      - start_time
      - tour
    GuideTour:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        activity_type:
          type: integer
        location:
          type: integer
        duration_minutes:
          type: integer
          maximum: 2147483647
          minimum: 1
        difficulty:
          $ref: '#/components/schemas/DifficultyEnum'
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        max_participants:
          type: integer
          maximum: 2147483647
          minimum: 1
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - activity_type
      - created_at
      - description
      - duration_minutes
      - id
      - location
      - max_participants
      - price
      - title
      - updated_at
    GuideTourSlot:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        start_time:
          type: string
          format: date-time
        available_spots:
          type: integer
          readOnly: true
      required:
      - available_spots
      - id
      - start_time
    Location:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
      required:
      - id
      - latitude
      - longitude
      - name
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
      required:
      - email
      - first_name
      - id
      - last_name
      - role
    NullEnum:
      enum:
      - null
    PatchedGuideTour:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        activity_type:
          type: integer
        location:
          type: integer
        duration_minutes:
          type: integer
          maximum: 2147483647
          minimum: 1
        difficulty:
          $ref: '#/components/schemas/DifficultyEnum'
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        max_participants:
          type: integer
          maximum: 2147483647
          minimum: 1
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Register:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
      required:
      - email
      - first_name
      - id
      - last_name
      - password
    Review:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reviewer:
          type: string
          readOnly: true
        rating:
          type: integer
          maximum: 32767
          minimum: 0
        comment:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - rating
      - reviewer
    ReviewCreate:
      type: object
      properties:
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - rating
    RoleEnum:
      enum:
      - guide
      - customer
      - admin
      type: string
      description: |-
        * `guide` - Guide
        * `customer` - Customer
        * `admin` - Admin
    SlotForecast:
      type: object
      properties:
        slot_id:
          type: integer
        start_time:
          type: string
          format: date-time
        forecast:
          allOf:
          - $ref: '#/components/schemas/WeatherForecast'
          nullable: true
        aurora:
          allOf:
          - $ref: '#/components/schemas/AuroraForecast'
          nullable: true
      required:
      - aurora
      - forecast
      - slot_id
      - start_time
    StatusEnum:
      enum:
      - pending
      - confirmed
      - cancelled
      type: string
      description: |-
        * `pending` - Pending
        * `confirmed` - Confirmed
        * `cancelled` - Cancelled
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    Tour:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        guide:
          type: string
          readOnly: true
        activity_type:
          type: string
          readOnly: true
        location:
          type: string
          readOnly: true
        duration_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
        difficulty:
          $ref: '#/components/schemas/DifficultyEnum'
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        max_participants:
          type: integer
          maximum: 2147483647
          minimum: 0
        average_rating:
