<div class="flex min-h-[80vh] items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center">
      <h1 class="text-3xl font-bold">Create your account</h1>
      <p class="mt-2 text-slate-600 dark:text-slate-400">Book Arctic adventures and keep track of your trips.</p>
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="mt-8 space-y-5 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900"
    >
      @if (generalError()) {
        <p class="rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700 dark:bg-red-950/50 dark:text-red-400" role="alert">
          {{ generalError() }}
        </p>
      }

      <div class="grid gap-5 sm:grid-cols-2">
        <label class="block text-sm">
          <span class="font-medium text-slate-700 dark:text-slate-300">First name</span>
          <input
            type="text"
            formControlName="first_name"
            autocomplete="given-name"
            class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-950"
          />
          @if (form.controls.first_name.touched && form.controls.first_name.invalid) {
            <span class="mt-1 block text-xs text-red-600 dark:text-red-400">Required.</span>
          }
          @for (message of serverErrors().first_name ?? []; track message) {
            <span class="mt-1 block text-xs text-red-600 dark:text-red-400">{{ message }}</span>
          }
        </label>

        <label class="block text-sm">
          <span class="font-medium text-slate-700 dark:text-slate-300">Last name</span>
          <input
            type="text"
            formControlName="last_name"
            autocomplete="family-name"
            class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-950"
          />
          @if (form.controls.last_name.touched && form.controls.last_name.invalid) {
            <span class="mt-1 block text-xs text-red-600 dark:text-red-400">Required.</span>
          }
          @for (message of serverErrors().last_name ?? []; track message) {
            <span class="mt-1 block text-xs text-red-600 dark:text-red-400">{{ message }}</span>
          }
        </label>
      </div>

      <label class="block text-sm">
        <span class="font-medium text-slate-700 dark:text-slate-300">Email</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-950"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="mt-1 block text-xs text-red-600 dark:text-red-400">Please enter a valid email.</span>
        }
        @for (message of serverErrors().email ?? []; track message) {
          <span class="mt-1 block text-xs text-red-600 dark:text-red-400">{{ message }}</span>
        }
      </label>

      <label class="block text-sm">
        <span class="font-medium text-slate-700 dark:text-slate-300">Password</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="new-password"
          class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-950"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="mt-1 block text-xs text-red-600 dark:text-red-400">At least 8 characters.</span>
        }
        @for (message of serverErrors().password ?? []; track message) {
          <span class="mt-1 block text-xs text-red-600 dark:text-red-400">{{ message }}</span>
        }
      </label>

      <button
        type="submit"
        [disabled]="submitting()"
        class="w-full rounded-xl bg-emerald-600 px-4 py-3 font-semibold text-white transition hover:bg-emerald-700 disabled:cursor-wait disabled:opacity-60"
      >
        {{ submitting() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600 dark:text-slate-400">
      Already have an account?
      <a
        routerLink="/login"
        [queryParams]="returnUrl !== '/' ? { returnUrl } : {}"
        class="font-semibold text-emerald-600 hover:underline dark:text-emerald-400"
      >
        Log in
      </a>
    </p>
  </div>
</div>
