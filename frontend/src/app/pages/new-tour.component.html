<div class="mx-auto max-w-3xl px-4 py-10">
  <a routerLink="/guide" class="text-sm font-semibold text-emerald-600 hover:underline dark:text-emerald-400">
    ← Guide panel
  </a>
  <h1 class="mt-4 text-3xl font-bold">New tour</h1>
  <p class="mt-2 text-slate-600 dark:text-slate-400">
    Add the details now. Photos can be uploaded by an admin, and dates are added from the guide panel.
  </p>

  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="mt-8 space-y-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900"
  >
    @if (generalError()) {
      <p class="rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700 dark:bg-red-950/50 dark:text-red-400" role="alert">
        {{ generalError() }}
      </p>
    }

    <label class="block text-sm">
      <span class="font-medium text-slate-700 dark:text-slate-300">Title</span>
      <input
        type="text"
        formControlName="title"
        placeholder="Snowshoe Hike in the Tromsø Hills"
        class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-950"
      />
      @if (showError('title')) {
        <span class="mt-1 block text-xs text-red-600 dark:text-red-400">A title is required.</span>
      }
      @for (message of serverErrors()['title'] ?? []; track message) {
        <span class="mt-1 block text-xs text-red-600 dark:text-red-400">{{ message }}</span>
      }
    </label>

    <label class="block text-sm">
      <span class="font-medium text-slate-700 dark:text-slate-300">Description</span>
      <textarea
        rows="5"
        formControlName="description"
        class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-950"
      ></textarea>
      @if (showError('description')) {
        <span class="mt-1 block text-xs text-red-600 dark:text-red-400">A description is required.</span>
      }
    </label>

    <div class="grid gap-6 sm:grid-cols-2">
      <label class="block text-sm">
        <span class="font-medium text-slate-700 dark:text-slate-300">Activity</span>
        <select
          formControlName="activity_type"
          class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-950"
        >
          <option [ngValue]="0" disabled>Select an activity…</option>
          @for (activity of activityTypes(); track activity.id) {
            <option [ngValue]="activity.id">{{ activity.name }}</option>
          }
        </select>
        @if (showError('activity_type')) {
          <span class="mt-1 block text-xs text-red-600 dark:text-red-400">Please choose an activity.</span>
        }
      </label>

      <label class="block text-sm">
        <span class="font-medium text-slate-700 dark:text-slate-300">Location</span>
        <select
          formControlName="location"
          class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-950"
        >
          <option [ngValue]="0" disabled>Select a location…</option>
          @for (location of locations(); track location.id) {
            <option [ngValue]="location.id">{{ location.name }}</option>
          }
        </select>
        @if (showError('location')) {
          <span class="mt-1 block text-xs text-red-600 dark:text-red-400">Please choose a location.</span>
        }
      </label>

      <label class="block text-sm">
        <span class="font-medium text-slate-700 dark:text-slate-300">Duration (minutes)</span>
        <input
          type="number"
          min="1"
          step="15"
          formControlName="duration_minutes"
          class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-950"
        />
      </label>

      <label class="block text-sm">
        <span class="font-medium text-slate-700 dark:text-slate-300">Difficulty</span>
        <select
          formControlName="difficulty"
          class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-950"
        >
          @for (difficulty of difficulties; track difficulty) {
            <option [ngValue]="difficulty">{{ difficulty.charAt(0).toUpperCase() + difficulty.slice(1) }}</option>
          }
        </select>
      </label>

      <label class="block text-sm">
        <span class="font-medium text-slate-700 dark:text-slate-300">Price per person (NOK)</span>
        <input
          type="number"
          min="0"
          step="10"
          formControlName="price"
          class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-950"
        />
        @for (message of serverErrors()['price'] ?? []; track message) {
          <span class="mt-1 block text-xs text-red-600 dark:text-red-400">{{ message }}</span>
        }
      </label>

      <label class="block text-sm">
        <span class="font-medium text-slate-700 dark:text-slate-300">Max participants</span>
        <input
          type="number"
          min="1"
          formControlName="max_participants"
          class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-950"
        />
        @for (message of serverErrors()['max_participants'] ?? []; track message) {
          <span class="mt-1 block text-xs text-red-600 dark:text-red-400">{{ message }}</span>
        }
      </label>
    </div>

    <label class="flex items-center gap-3 text-sm">
      <input type="checkbox" formControlName="is_active" class="h-4 w-4 accent-emerald-600" />
      <span class="text-slate-700 dark:text-slate-300">Publish immediately</span>
    </label>

    <div class="flex gap-3">
      <button
        type="submit"
        [disabled]="submitting()"
        class="rounded-xl bg-emerald-600 px-6 py-3 font-semibold text-white transition hover:bg-emerald-700 disabled:cursor-wait disabled:opacity-60"
      >
        {{ submitting() ? 'Creating…' : 'Create tour' }}
      </button>
      <a
        routerLink="/guide"
        class="rounded-xl px-6 py-3 font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800"
      >
        Cancel
      </a>
    </div>
  </form>
</div>
